server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  location /socket.io/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
